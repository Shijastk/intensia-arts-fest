name: One-time Supreme Admin Account Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary Supreme Admin account patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Supreme Admin email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/SuperAdminPage.tsx')
          text = path.read_text()
          old = "  'shijasmuhammed573@gmail.com'\n]"
          new = "  'shijasmuhammed573@gmail.com',\n  'muzzammil2007anu@gmail.com'\n]"
          if "'muzzammil2007anu@gmail.com'" not in text:
              if old not in text:
                  raise SystemExit('Expected ALLOWED_EMAILS block was not found; refusing to modify the file.')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Commit account change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SuperAdminPage.tsx
          git diff --cached --quiet || git commit -m "Add Supreme Admin account muzzammil2007anu@gmail.com"
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/one-time-add-supreme-admin.yml
          git add .github/workflows/one-time-add-supreme-admin.yml
          git commit -m "Remove temporary Supreme Admin patch workflow"
          git push